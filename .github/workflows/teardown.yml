name: Teardown GCP Infrastructure

# Removes Cloud Run services, Cloud Function, Cloud Scheduler job, Load Balancer,
# and Artifact Registry. Preserves: GCS buckets, service account, secrets, and
# Workload Identity config so the deploy workflow can be re-run if needed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "teardown" to confirm'
        required: true

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  teardown:
    name: Remove GCP services
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'teardown'

    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME }}

    steps:
      # ── 1. Guard: require non-empty repo vars ─────────────────────────────────
      - name: Validate required variables
        run: |
          missing=()
          [[ -z "$PROJECT" ]] && missing+=(GCP_PROJECT_ID)
          [[ -z "$REGION"  ]] && missing+=(GCP_REGION)
          [[ -z "$SERVICE" ]] && missing+=(GCP_SERVICE_NAME)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: missing repo variables: ${missing[*]}"
            exit 1
          fi
          echo "Target — project: $PROJECT  region: $REGION  service: $SERVICE"

      # ── 2. Authenticate to GCP ────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      # ── 3. Install gcloud SDK ─────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 4. Cloud Scheduler ────────────────────────────────────────────────────
      - name: Delete Cloud Scheduler job
        run: |
          gcloud scheduler jobs delete daily-bg-generate \
            --location=europe-west1 \
            --quiet \
            --project="$PROJECT" 2>/dev/null || echo "Scheduler job not found, skipping"

      # ── 5. Cloud Function (bg-generator) ─────────────────────────────────────
      - name: Delete bg-generator Cloud Function
        run: |
          gcloud functions delete bg-generator \
            --gen2 \
            --region="$REGION" \
            --quiet \
            --project="$PROJECT" 2>/dev/null || echo "Cloud Function not found, skipping"

      # ── 6. Cloud Run (life-dashboard) ─────────────────────────────────────────
      - name: Delete life-dashboard Cloud Run service
        run: |
          gcloud run services delete "$SERVICE" \
            --region="$REGION" \
            --quiet \
            --project="$PROJECT" 2>/dev/null || echo "Cloud Run service not found, skipping"

      # ── 7. Load Balancer ──────────────────────────────────────────────────────
      - name: Delete Load Balancer components
        run: |
          gcloud compute forwarding-rules delete "${SERVICE}-https-rule" --global --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute target-https-proxies delete "${SERVICE}-https-proxy" --global --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute ssl-certificates delete "${SERVICE}-cert" --global --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute url-maps delete "${SERVICE}-urlmap" --global --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute backend-services delete "${SERVICE}-backend" --global --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute network-endpoint-groups delete "${SERVICE}-neg" --region="$REGION" --quiet --project="$PROJECT" 2>/dev/null || true
          gcloud compute addresses delete "${SERVICE}-ip" --global --quiet --project="$PROJECT" 2>/dev/null || true
          echo "Load Balancer components removed"

      # ── 8. Artifact Registry ──────────────────────────────────────────────────
      - name: Delete Artifact Registry repository
        run: |
          gcloud artifacts repositories delete life-dashboard \
            --location="$REGION" \
            --quiet \
            --project="$PROJECT" 2>/dev/null || echo "Artifact Registry repo not found, skipping"

      # ── 9. Summary ────────────────────────────────────────────────────────────
      - name: Teardown summary
        run: |
          echo "Teardown complete."
          echo ""
          echo "Preserved (intentionally):"
          echo "  gs://${PROJECT}-dashboard-data  (your TinyDB data)"
          echo "  gs://${PROJECT}-dashboard-bg    (background images)"
          echo "  Service account + Workload Identity config      (re-deploy still works)"
          echo "  Secret Manager secrets"
          echo ""
          echo "Note: DNS records still point to the now-deleted load balancer IP."
          echo "Update or remove them via your DNS provider if no longer needed."
